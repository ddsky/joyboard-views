    position: absolute;

    bottom: 0;

const STAMPS = {
  de: ["Amtlich geprüft", "Deutschland"],
  welt: ["International", "Weltweit"],
  geschichte: ["Aus dem Archiv", "Historisch"],
  witz: ["Nicht absetzbar", "Witz"],
  zitat: ["Zu Protokoll", "Zitat"],
};

const params = new URLSearchParams(location.search);

const theme = (params.get("theme") || "").toLowerCase();
if (theme.startsWith("hell") || theme === "light") document.documentElement.dataset.theme = "light";
if (theme.startsWith("dunkel") || theme === "dark") document.documentElement.dataset.theme = "dark";

// Jeder Eintrag bleibt mindestens 20 Sekunden stehen; 0 schaltet den automatischen Wechsel ab.
const MIN_INTERVAL = 20;
const intervalParam = parseFloat(params.get("interval"));
const INTERVAL = Number.isFinite(intervalParam) ? (intervalParam <= 0 ? 0 : Math.max(MIN_INTERVAL, intervalParam)) : 60;

function categoriesFor(value) {
  const v = (value || "").toLowerCase();
  if (v.startsWith("deutsch")) return ["de"];
  if (v.startsWith("welt") || v.startsWith("geschichte")) return ["welt", "geschichte"];
  if (v.startsWith("witz") || v.startsWith("zitat")) return ["witz", "zitat"];
  if (v.includes("fakt")) return ["de", "welt", "geschichte"];
  return Object.keys(STAMPS);
}
const CATS = categoriesFor(params.get("category"));
const POOL = FACTS.map((f, i) => (CATS.includes(f.c) ? i : -1)).filter(i => i >= 0);

// Mischbeutel: Beim Laden und bei jedem Wechsel kommt ein zufälliger Eintrag. Jeder Eintrag kommt
// einmal dran, bevor sich etwas wiederholt – auch über Neuladen hinweg.
const BAG_KEY = `usw-bag:${CATS.join("+")}:${FACTS.length}`;
const LAST_KEY = `usw-last:${FACTS.length}`;
function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* egal */ } }

let bag = (load(BAG_KEY) || []).filter(i => POOL.includes(i));
// zuletzt gezeigter Eintrag, damit nach dem Neuladen nicht derselbe wieder erscheint
let current = Number.isInteger(load(LAST_KEY)) ? load(LAST_KEY) : -1;

function drawIndex() {
  if (!bag.length) {
    bag = POOL.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  if (bag.length > 1 && bag[bag.length - 1] === current) bag.unshift(bag.pop());
  const next = bag.pop();
  save(BAG_KEY, bag);
  return next;
}

const els = {
  main: document.querySelector("main"),
  fact: document.getElementById("fact"),
  az: document.getElementById("az"),
  stamp: document.getElementById("stamp"),
  date: document.getElementById("date"),
  progress: document.getElementById("progress"),
};

function fit() {
  const box = els.main;
  const style = getComputedStyle(box);
  const h = box.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  const w = box.clientWidth;
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  let lo = 12;
  // Obergrenze: mind. ~22 Zeichen pro Zeile, damit kurze Texte nicht in Einzelwörter zerfallen
  let hi = Math.max(lo + 1, Math.min(h * 0.3, w / 10.5, 12 * vmin));
  for (let k = 0; k < 18; k++) {
    const mid = (lo + hi) / 2;
    els.fact.style.fontSize = mid + "px";
    if (els.fact.scrollHeight <= h && els.fact.scrollWidth <= w) lo = mid; else hi = mid;
  }
  // etwas Luft lassen: weniger Silbentrennung, ruhigeres Schriftbild
  els.fact.style.fontSize = Math.floor(lo * 0.94) + "px";
}

function fill(index) {
  const f = FACTS[index];
  els.fact.textContent = "";
  els.fact.classList.toggle("is-quote", f.c === "zitat");
  const text = document.createElement("span");
  text.className = "text";
  text.textContent = f.c === "zitat" ? `„${f.t}“` : f.t;
  els.fact.append(text);
  if (f.a) {
    const by = document.createElement("span");
    by.className = "by";
    by.textContent = "— " + f.a;
    els.fact.append(by);
  }
  els.az.textContent = `Az. USW-${String(index + 1).padStart(3, "0")}`;
  const [small, big] = STAMPS[f.c];
  els.stamp.dataset.cat = f.c;
  els.stamp.innerHTML = "";
  const s = document.createElement("small");
  s.textContent = small;
  const b = document.createElement("b");
  b.textContent = big;
  els.stamp.append(s, b);
  els.stamp.classList.remove("thump");
  void els.stamp.offsetWidth;
  els.stamp.classList.add("thump");
  fit();
}

let timer = 0;
let busy = false;

function schedule() {
  clearTimeout(timer);
  els.progress.classList.remove("run");
  if (!INTERVAL) return;
  void els.progress.offsetWidth;
  els.progress.style.animationDuration = INTERVAL + "s";
  els.progress.classList.add("run");
  timer = setTimeout(next, INTERVAL * 1000);
}

function show(index, animate) {
  current = index;
  save(LAST_KEY, index);
  if (!animate) {
    fill(index);
    schedule();
    return;
  }
  busy = true;
  els.fact.classList.add("leaving");
  setTimeout(() => {
    els.fact.classList.remove("leaving");
    els.fact.classList.add("entering");
    fill(index);
    void els.fact.offsetWidth;
    els.fact.classList.remove("entering");
    busy = false;
    schedule();
  }, 320);
}

function next() {
  if (busy || !POOL.length) return;
  show(drawIndex(), true);
}

els.date.textContent = new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });

show(drawIndex(), false);

// Tippen zeigt den naechsten Eintrag, Wischen gehoert dem Joyboard. Die Seite laeuft im Joyboard in
// einem iframe: Zeigerereignisse erreichen das Board dort nie, ein Wisch wuerde also nur den naechsten
// Fakt ziehen statt den Screen zu wechseln. Horizontale Wische werden deshalb ans Board gemeldet.
// joyboard-swipe-start (Vertrag fuer tests/steuerwissen-interaction.test.mjs)
const SWIPE_THRESHOLD_PX = 50;
function classifyPointerGesture(dx, dy) {
  if (Math.abs(dx) > SWIPE_THRESHOLD_PX && Math.abs(dx) > Math.abs(dy)) {
    return dx < 0 ? "swipe-left" : "swipe-right";
  }
  return "tap";
}
// joyboard-swipe-end

function notifyBoard(gesture) {
  if (window.parent === window) return false;
  try {
    window.parent.postMessage({ joyboard: "swipe", direction: gesture === "swipe-left" ? "left" : "right" }, "*");
    return true;
  } catch {
    return false;
  }
}

let pointerStart = null;
let activePointerId = null;

document.addEventListener("pointerdown", e => {
  if (e.isPrimary === false) return;
  activePointerId = e.pointerId;
  pointerStart = { x: e.clientX, y: e.clientY };
  if (e.target && e.target.setPointerCapture) {
    try { e.target.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  }
});

document.addEventListener("pointercancel", e => {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  pointerStart = null;
  activePointerId = null;
});

document.addEventListener("pointerup", e => {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  const start = pointerStart;
  pointerStart = null;
  activePointerId = null;
  const gesture = start ? classifyPointerGesture(e.clientX - start.x, e.clientY - start.y) : "tap";
  if (gesture === "tap") { next(); return; }
  // Nimmt das Board den Wisch nicht an (Seite laeuft eigenstaendig), bleibt es beim naechsten Eintrag.
  if (!notifyBoard(gesture)) next();
});
document.addEventListener("keydown", e => {
  if ([" ", "Enter", "ArrowRight"].includes(e.key)) { e.preventDefault(); next(); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
let resizeFrame = 0;
new ResizeObserver(() => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(fit);
}).observe(els.main);
</script>
